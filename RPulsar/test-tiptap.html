<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Tiptap</title>
    <style>
        .editor-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .ProseMirror {
            min-height: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .ProseMirror-focused {
            outline: 2px solid #007bff;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <h1>Тест Tiptap редактора</h1>
        <div id="toolbar">
            <button data-action="bold">Bold</button>
            <button data-action="italic">Italic</button>
            <button data-action="heading1">H1</button>
            <button data-action="bulletList">Список</button>
        </div>
        <div id="editor"></div>
        <div id="status" style="margin-top: 20px; color: #666;"></div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        function log(msg) {
            statusDiv.innerHTML += '<div>' + msg + '</div>';
            console.log(msg);
        }
        
        log('Начало загрузки...');
    </script>
    
    <!-- Загружаем ProseMirror -->
    <script src="libs/tiptap/prosemirror-model.js"></script>
    <script>log('prosemirror-model загружен');</script>
    
    <script src="libs/tiptap/prosemirror-state.js"></script>
    <script>log('prosemirror-state загружен');</script>
    
    <script src="libs/tiptap/prosemirror-transform.js"></script>
    <script>log('prosemirror-transform загружен');</script>
    
    <script src="libs/tiptap/prosemirror-view.js"></script>
    <script>log('prosemirror-view загружен');</script>
    
    <script src="libs/tiptap/prosemirror-keymap.js"></script>
    <script>log('prosemirror-keymap загружен');</script>
    
    <script src="libs/tiptap/prosemirror-commands.js"></script>
    <script>log('prosemirror-commands загружен');</script>
    
    <script src="libs/tiptap/prosemirror-schema-basic.js"></script>
    <script>log('prosemirror-schema-basic загружен');</script>
    
    <script src="libs/tiptap/prosemirror-schema-list.js"></script>
    <script>log('prosemirror-schema-list загружен');</script>
    
    <script src="libs/tiptap/prosemirror-dropcursor.js"></script>
    <script>log('prosemirror-dropcursor загружен');</script>
    
    <script src="libs/tiptap/prosemirror-gapcursor.js"></script>
    <script>log('prosemirror-gapcursor загружен');</script>
    
    <script src="libs/tiptap/prosemirror-history.js"></script>
    <script>log('prosemirror-history загружен');</script>
    
    <script src="libs/tiptap/prosemirror-inputrules.js"></script>
    <script>log('prosemirror-inputrules загружен');</script>
    
    <!-- Загружаем Tiptap -->
    <script src="libs/tiptap/tiptap-core.js"></script>
    <script>log('tiptap-core загружен');</script>
    
    <script src="libs/tiptap/tiptap-starter-kit.js"></script>
    <script>log('tiptap-starter-kit загружен');</script>
    
    <script src="libs/tiptap/tiptap-extension-placeholder.js"></script>
    <script>log('tiptap-extension-placeholder загружен');</script>
    
    <script>
        log('Все скрипты загружены. Проверка переменных...');
        log('window.core: ' + (typeof window.core !== 'undefined' ? 'OK' : 'NOT FOUND'));
        log('window["@tiptap/core"]: ' + (typeof window['@tiptap/core'] !== 'undefined' ? 'OK' : 'NOT FOUND'));
        log('window["@tiptap/starter-kit"]: ' + (typeof window['@tiptap/starter-kit'] !== 'undefined' ? 'OK' : 'NOT FOUND'));
        
        // Пробуем создать редактор
        setTimeout(function() {
            try {
                var Editor = window.core?.Editor || (window['@tiptap/core'] && window['@tiptap/core'].Editor);
                var StarterKit = window['@tiptap/starter-kit']?.default;
                
                if (!Editor) {
                    log('ОШИБКА: Не найден класс Editor!');
                    return;
                }
                
                log('Создание редактора...');
                
                var editor = new Editor({
                    element: document.querySelector('#editor'),
                    extensions: [
                        StarterKit ? StarterKit.configure({
                            placeholder: {
                                placeholder: 'Введите текст...'
                            }
                        }) : []
                    ],
                    content: '<p>Привет, мир!</p>'
                });
                
                log('Редактор успешно создан!');
                
                // Обработчики кнопок
                document.querySelectorAll('#toolbar button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        var action = this.getAttribute('data-action');
                        switch(action) {
                            case 'bold': editor.chain().focus().toggleBold().run(); break;
                            case 'italic': editor.chain().focus().toggleItalic().run(); break;
                            case 'heading1': editor.chain().focus().toggleHeading({ level: 1 }).run(); break;
                            case 'bulletList': editor.chain().focus().toggleBulletList().run(); break;
                        }
                    });
                });
                
            } catch(e) {
                log('ОШИБКА при создании редактора: ' + e.message);
                console.error(e);
            }
        }, 1000);
    </script>
</body>
</html>

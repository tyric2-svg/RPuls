<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
<style>
    .bg { fill: #1E1B17; }
    .ring-outer { stroke: #B9B4A9; stroke-opacity: 0.35; }
    .ring-middle { stroke: #8A857C; stroke-opacity: 0.6; }
    .ring-inner { stroke: #D9A83A; stroke-opacity: 0.9; }
    .dot { fill: #C9971F; }

    /* Системная тёмная тема браузера/ОС — переключаемся на светлый бейдж,
       чтобы значок оставался читаемым на тёмных вкладках/панели закладок. */
    @media (prefers-color-scheme: dark) {
        .bg { fill: #EFEBE2; }
        .ring-inner { stroke: #C9971F; }
        .dot { fill: #1E1B17; }
    }
</style>
<rect class="bg" x="0" y="0" width="24" height="24" rx="6"/>
<circle class="ring-outer" cx="12" cy="12" r="9" fill="none" stroke-width="0.9"/>
<circle class="ring-middle" cx="12" cy="12" r="6.5" fill="none" stroke-width="1.1"/>
<circle class="ring-inner" cx="12" cy="12" r="4" fill="none" stroke-width="1.4"/>
<circle class="dot" cx="12" cy="12" r="2"/>
</svg>
